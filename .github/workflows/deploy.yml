name: Build and Push to Azure Container Registry

# This tells GitHub to run this script every time you push to the 'main' branch
on:
  push:
    branches: [ "sport-api" ] 

jobs:
  build-and-push:
    # This uses a free Linux server provided by GitHub
    runs-on: ubuntu-latest 

    steps:
    # Step 1: Get your code onto the GitHub server
    - name: Check out the repository
      uses: actions/checkout@v4

    # Step 2: Log into your Azure Registry using the secrets you saved
    - name: Log in to Azure Container Registry
      uses: azure/docker-login@v1
      with:
        login-server: sportregistry.azurecr.io
        username: ${{ secrets.ACR_USERNAME }}
        password: ${{ secrets.ACR_PASSWORD }}

    # Step 3: Build the Docker image and push it to Azure
    - name: Build and push the image
      run: |
        # We tag the image with 'latest' and the specific commit ID for tracking
        docker build -t sportregistry.azurecr.io/sportapiimage:latest .
        docker push sportregistry.azurecr.io/sportapiimage:latest